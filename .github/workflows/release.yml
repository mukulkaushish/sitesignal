name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.7

jobs:
  quality:
    name: Release quality gate
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  linux:
    name: Linux release (${{ matrix.arch }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libayatana-appindicator3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get
      - name: Build release
        run: >-
          dart run tool/build_all_platforms.dart
          --target linux
          --arch "${{ matrix.arch }}"
          --skip-pub-get
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sitesignal-linux-${{ matrix.arch }}
          path: build/distributions/linux/*/*.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  macos:
    name: macOS release (ARM64 and x86_64)
    needs: quality
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - name: Build architecture-specific releases
        run: >-
          dart run tool/build_all_platforms.dart
          --target macos
          --arch all
          --skip-pub-get
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sitesignal-macos
          path: build/distributions/macos/*/*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  windows:
    name: Windows release (${{ matrix.arch }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x86_64
          - os: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - name: Build and package release
        run: >-
          dart run tool/build_all_platforms.dart
          --target windows
          --arch "${{ matrix.arch }}"
          --skip-pub-get
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sitesignal-windows-${{ matrix.arch }}
          path: |
            build/distributions/windows/*/*.zip
            build/distributions/windows/*/*.msix
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  android:
    name: Android release APKs
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android feature flow
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4a
          emulator-port: 5554
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back none
          script: flutter test integration_test/feature_flow_test.dart --device-id emulator-5554
      - name: Build split release APKs
        run: >-
          dart run tool/build_all_platforms.dart
          --target android
          --arch all
          --skip-pub-get
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sitesignal-android-apks
          path: build/distributions/android/*/*.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish checksummed stable release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [linux, macos, windows, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-sitesignal-*
          path: release-downloads
          merge-multiple: true
      - name: Validate and flatten 11 packages
        shell: bash
        run: |
          expected_files=(
            SiteSignal-android-arm64.apk
            SiteSignal-android-armv7.apk
            SiteSignal-android-x86_64.apk
            SiteSignal-linux-arm64.tar.gz
            SiteSignal-linux-x86_64.tar.gz
            SiteSignal-macos-arm64.zip
            SiteSignal-macos-x86_64.zip
            SiteSignal-windows-arm64.msix
            SiteSignal-windows-arm64.zip
            SiteSignal-windows-x86_64.msix
            SiteSignal-windows-x86_64.zip
          )
          mapfile -d '' downloaded < <(find release-downloads -type f -print0)
          if (( ${#downloaded[@]} != ${#expected_files[@]} )); then
            echo "Expected 11 packages, found ${#downloaded[@]}." >&2
            exit 1
          fi
          mkdir release-assets
          for expected in "${expected_files[@]}"; do
            mapfile -d '' matches < <(find release-downloads -type f -name "$expected" -print0)
            if (( ${#matches[@]} != 1 )); then
              echo "Expected one $expected, found ${#matches[@]}." >&2
              exit 1
            fi
            cp "${matches[0]}" "release-assets/$expected"
          done
          (
            cd release-assets
            sha256sum "${expected_files[@]}" > SHA256SUMS.txt
          )
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 12
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' release_files < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          test "${#release_files[@]}" -eq 12
          gh release create "$GITHUB_REF_NAME" "${release_files[@]}" \
            --verify-tag \
            --title "SiteSignal ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "Builds are produced by free public-repository runners. They are unsigned, ad-hoc signed, or development signed; see BUILD.md before installing."
