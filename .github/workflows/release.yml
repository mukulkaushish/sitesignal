name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.7

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: bash -n tool/*.sh
      - run: dart run tool/check_code_rules.dart
      - run: flutter analyze
      - run: flutter test

  linux:
    name: Linux release (${{ matrix.arch }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libayatana-appindicator3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get
      - name: Build release
        run: >-
          dart run tool/build_all_platforms.dart
          --target linux
          --arch "${{ matrix.arch }}"
          --skip-pub-get
      - uses: actions/upload-artifact@v7
        with:
          name: sitesignal-linux-${{ matrix.arch }}
          path: build/distributions/linux/*/*.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  macos:
    name: macOS release (ARM64 and x86_64)
    needs: quality
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - name: Build architecture-specific releases
        run: >-
          dart run tool/build_all_platforms.dart
          --target macos
          --arch all
          --skip-pub-get
      - uses: actions/upload-artifact@v7
        with:
          name: sitesignal-macos
          path: build/distributions/macos/*/*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  windows:
    name: Windows release (${{ matrix.arch }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
          - os: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - name: Build and package release
        run: >-
          dart run tool/build_all_platforms.dart
          --target windows
          --arch "${{ matrix.arch }}"
          --skip-pub-get
      - uses: actions/upload-artifact@v7
        with:
          name: sitesignal-windows-${{ matrix.arch }}
          path: |
            build/distributions/windows/*/*.zip
            build/distributions/windows/*/*.msix
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  android:
    name: Android release APKs
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - name: Build split release APKs
        run: >-
          dart run tool/build_all_platforms.dart
          --target android
          --arch all
          --skip-pub-get
      - uses: actions/upload-artifact@v7
        with:
          name: sitesignal-android-apks
          path: build/distributions/android/*/*.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish checksummed prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sitesignal-*
          path: release-assets
          merge-multiple: true
      - name: Include feature walkthrough
        run: >-
          cp docs/walkthrough/sitesignal-android.mp4
          release-assets/sitesignal-android-walkthrough.mp4
      - name: Create checksums
        run: |
          find release-assets -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" release-assets/SHA256SUMS.txt
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' release_files < <(find release-assets -type f -print0 | sort -z)
          gh release create "$GITHUB_REF_NAME" "${release_files[@]}" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --notes "These free CI artifacts are unsigned, ad-hoc signed, or development signed. Review BUILD.md before installing or redistributing them."
