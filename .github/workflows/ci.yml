name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: dart run tool/check_code_rules.dart
      - run: flutter analyze
      - run: flutter test

  linux:
    name: Linux release (${{ matrix.arch }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          cache: true
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libayatana-appindicator3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get
      - name: Build release
        run: >-
          dart run tool/build_all_platforms.dart
          --target linux
          --arch "${{ matrix.arch }}"
          --skip-pub-get
      - uses: actions/upload-artifact@v4
        with:
          name: sitesignal-linux-${{ matrix.arch }}
          path: build/distributions/linux/*/*.tar.gz

  macos:
    name: macOS release (ARM64 + x86_64)
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          cache: true
      - run: flutter pub get
      - name: Build architecture-specific releases
        run: >-
          dart run tool/build_all_platforms.dart
          --target macos
          --arch all
          --skip-pub-get
      - uses: actions/upload-artifact@v4
        with:
          name: sitesignal-macos
          path: build/distributions/macos/*/*.zip

  windows:
    name: Windows release (${{ matrix.arch }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
          - os: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          cache: true
      - run: flutter pub get
      - name: Build and package release
        run: >-
          dart run tool/build_all_platforms.dart
          --target windows
          --arch "${{ matrix.arch }}"
          --skip-pub-get
      - uses: actions/upload-artifact@v4
        with:
          name: sitesignal-windows-${{ matrix.arch }}
          path: |
            build/distributions/windows/*/*.zip
            build/distributions/windows/*/*.msix

  android:
    name: Android release APKs (ARMv7 + ARM64 + x86_64)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          cache: true
      - run: flutter pub get
      - name: Build split release APKs
        run: >-
          dart run tool/build_all_platforms.dart
          --target android
          --arch all
          --skip-pub-get
      - uses: actions/upload-artifact@v4
        with:
          name: sitesignal-android-apks
          path: build/distributions/android/*/*.apk

  ios:
    name: iOS unsigned release
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          cache: true
      - run: flutter pub get
      - name: Build unsigned ARM64 device release
        run: >-
          dart run tool/build_all_platforms.dart
          --target ios
          --arch arm64
          --skip-pub-get
      - uses: actions/upload-artifact@v4
        with:
          name: sitesignal-ios-arm64-unsigned
          path: build/distributions/ios/arm64/*.zip
