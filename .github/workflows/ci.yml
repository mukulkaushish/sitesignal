name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.7

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  macos-screenshots:
    name: Capture macOS light screenshots
    needs: quality
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install dependencies
        run: flutter pub get
      - name: Capture overview, history, and settings
        run: ./tool/capture_repository_screenshots.sh macos
      - name: Validate screenshot files and dimensions
        run: dart run tool/check_code_rules.dart
      - name: Upload current screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sitesignal-screenshots-macos
          path: docs/screenshots/macos-*-light.png
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  android-integration:
    name: Verify Android flow and capture light screenshots
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install dependencies
        run: flutter pub get
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run feature flow and capture three screenshots
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4a
          emulator-port: 5554
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back none
          script: |
            flutter test integration_test/feature_flow_test.dart --device-id emulator-5554
            ANDROID_DEVICE_ID=emulator-5554 ./tool/capture_repository_screenshots.sh android
            dart run tool/check_code_rules.dart
      - name: Upload current screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sitesignal-screenshots-android
          path: docs/screenshots/android-*-light.png
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
